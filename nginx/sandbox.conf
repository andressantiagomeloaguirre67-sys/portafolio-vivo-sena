server {
    listen 8088;
    server_name localhost;

    root /var/www/sandbox_projects;
    index index.html index.htm;

    # Cabeceras de aislamiento de seguridad para ejecución de proyectos en iframe (Sandbox)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'none'; frame-ancestors http://localhost:5173 http://127.0.0.1:5173 http://localhost:8000;" always;

    # Deshabilitar listado de directorios
    autoindex off;

    location /proyectos/ {
        alias /var/www/sandbox_projects/;
        try_files $uri $uri/ =404;

        # Impedir caché agresiva cuando un Grupo Scrum reemplaza su entrega más reciente
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location /health {
        access_log off;
        return 200 "Sandbox OK\n";
        add_header Content-Type text/plain;
    }
}

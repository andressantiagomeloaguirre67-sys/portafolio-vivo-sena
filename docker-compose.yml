services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: portafolio_sena_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portafolio_sena}
      POSTGRES_USER: ${POSTGRES_USER:-sena_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sena_secret_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sena_user} -d ${POSTGRES_DB:-portafolio_sena}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: portafolio_sena_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: portafolio_sena_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_sena_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_sena_password_2026}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  nginx-sandbox:
    image: nginx:1.27-alpine
    container_name: portafolio_sena_sandbox
    restart: unless-stopped
    ports:
      - "${SANDBOX_PORT:-8088}:8088"
    volumes:
      - ./nginx/sandbox.conf:/etc/nginx/conf.d/default.conf:ro
      - sandbox_projects:/var/www/sandbox_projects:ro
    depends_on:
      - minio

volumes:
  postgres_data:
  redis_data:
  minio_data:
  sandbox_projects:
